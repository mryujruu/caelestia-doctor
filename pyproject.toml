[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "caelestia-doctor"
version = "0.6.0"
description = "Diagnose and safely repair Arch-based Linux, Hyprland, and Caelestia configuration issues"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Adam" }]
keywords = ["caelestia", "hyprland", "quickshell", "arch", "dotfiles", "diagnostics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/mryujruu/caelestia-doctor"
Issues = "https://github.com/mryujruu/caelestia-doctor/issues"
Changelog = "https://github.com/mryujruu/caelestia-doctor/blob/main/CHANGELOG.md"

[project.scripts]
caelestia-doctor = "caelestia_doctor.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
