name: Bug report
description: caelestia-doctor crashed, reported something wrong, or missed a problem
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what did you get?
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report
      description: Paste the output of `caelestia-doctor report`.
      render: markdown
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `caelestia-doctor --version`
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I read the report and removed anything private.
          required: true
